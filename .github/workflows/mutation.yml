# Nightly mutation testing: a mutation run costs seconds on the template
# skeleton but scales with the codebase, so it stays off the PR path — this
# workflow runs on a cron and fails the scheduled run only when the mutation
# score drops below the floor. The floor and the addopts override are
# reasoned in the [tool.mutmut] comments in pyproject.toml.
permissions:
  contents: read  # least privilege: no step in this workflow writes to the repo (GitHub secure-use reference)
name: mutation

on:
  schedule:
    - cron: "17 4 * * *"  # nightly, off the hour so it does not race the shared-runner rush
  workflow_dispatch:  # manual trigger to verify the gate without waiting for the schedule

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # bounds a hung network gate; GitHub's default is 360
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"  # the requires-python floor: every gate below must hold on it
          cache: pip
      # The mutation job installs only the mutation path: the mutmut and
      # pytest pins requirements-lock.txt records. The coverage stack stays
      # off this
      # path — the -o addopts= override in pyproject.toml strips the cov
      # gate from mutmut's internal pytest runs.
      - run: >-
          python -m pip install --require-hashes -r requirements-lock.txt
      - run: mutmut run
      - run: mutmut export-cicd-stats
      - name: Mutation score floor (85, from the stats mutmut exports)
        run: |
          python3 -c "import json, sys; s = json.load(open('mutants/mutmut-cicd-stats.json')); score = 100 * s['killed'] // s['total']; print('mutation score %d%% (killed %d/%d, floor 85)' % (score, s['killed'], s['total'])); sys.exit(0 if score >= 85 else 1)"
